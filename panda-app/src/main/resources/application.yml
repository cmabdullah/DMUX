spring:
  application:
    name: panda-app

  # DB credentials are injected as env vars (SPRING_DATASOURCE_USERNAME / _PASSWORD) from the
  # K8s Secret `panda-db-credentials`, which Ansible populates from OpenBao at deploy time.
  # The app does NOT talk to OpenBao — no Spring Cloud Vault.
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:panda}
    hikari:
      connection-timeout: 10000

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
