apiVersion: apps/v1
kind: Deployment
metadata:
  name: panda-app
  namespace: panda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: panda-app
  template:
    metadata:
      labels:
        app: panda-app
    spec:
      containers:
        - name: panda-app
          image: panda-app:0.3.0 # or <registry>/panda-app:0.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # DB creds come from the panda-db-credentials Secret (populated by Ansible from OpenBao).
          # The app is Vault-unaware: no BAO_* env, no Vault library.
          envFrom:
            - secretRef:
                name: panda-db-credentials # SPRING_DATASOURCE_USERNAME / _PASSWORD
          env:
            - { name: DB_HOST, value: "192.168.64.1" }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_NAME, value: "panda" }
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
