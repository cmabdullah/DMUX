---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-demo
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ingress-demo-1
                port:
                  number: 80
          - path: /app2
            pathType: Prefix
            backend:
              service:
                name: ingress-demo-2
                port:
                  number: 80
          - path: /app3
            pathType: Prefix
            backend:
              service:
                name: ingress-demo-3
                port:
                  number: 80
